upstream lct_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # /api is also a client-side route (the API lab); API requests use /api/*.
    location = /api {
        try_files $uri /index.html;
    }

    # Keep health endpoints observable through the single public port.
    location = /healthz {
        proxy_pass http://lct_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /readyz {
        proxy_pass http://lct_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The API owns the /api/* namespace.  Buffering must stay off for
    # /api/chat/stream so status and token events reach the browser promptly.
    location /api/ {
        proxy_pass http://lct_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering "no" always;
    }

    # Vite's history fallback for React Router deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
