[project]
name = "lct-predict-agent-backend"
version = "0.1.0"
description = "通用 AI Agent 平台（LCT-predict-agent）后端 - P0 MVP"
requires-python = ">=3.11"
authors = [{ name = "LCT Platform Arch" }]
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "bcrypt>=4.2",
    "cryptography>=43",
    "PyJWT>=2.9",
    "jsonschema>=4.23",
    "apscheduler>=3.10",
    "orjson>=3.10",
    "python-multipart>=0.0.9",
    "openai>=3.3.1",
    "pytest>=9.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
